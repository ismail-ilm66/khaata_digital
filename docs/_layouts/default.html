<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url == "/" %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
  <style>
    :root { --bg: #fafaf8; --text: #1c1c1a; --muted: #6b6b66; --line: #e6e6e1; --brand: #0e7c4a; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121412; --text: #e8e8e4; --muted: #9a9a94; --line: #2a2d2a; --brand: #3dbe7e; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 17px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header, main, footer { max-width: 680px; margin: 0 auto; padding: 0 20px; }
    header { padding-top: 28px; }
    header a { color: var(--brand); font-weight: 700; text-decoration: none; letter-spacing: .01em; }
    main { padding-top: 8px; padding-bottom: 40px; }
    h1 { font-size: 1.9rem; line-height: 1.25; margin: 1.2em 0 .3em; }
    h2 { font-size: 1.15rem; margin: 2em 0 .4em; }
    a { color: var(--brand); }
    ul { padding-left: 1.2em; }
    li { margin: .3em 0; }
    footer { border-top: 1px solid var(--line); padding-top: 16px; padding-bottom: 40px;
      color: var(--muted); font-size: .9rem; }
    footer a { color: inherit; margin-right: 16px; }
  </style>
</head>
<body>
  <header><a href="{{ '/' | relative_url }}">{{ site.title }}</a></header>
  <main>{{ content }}</main>
  <footer>
    <a href="{{ '/privacy-policy' | relative_url }}">Privacy policy</a>
    <a href="{{ '/terms' | relative_url }}">Terms of use</a>
  </footer>
</body>
</html>
